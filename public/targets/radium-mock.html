<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radium Panel Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens ------------------------------------------------------
   Neutrals are Radium's own (web-app/src/index.css). The lab variables
   below them are what the sliders move. */
:root {
  --acc-h: 250;
  --acc-c: 0;
  --grad-h: 250;
  --grad-c: 0.09;
  --r-card: 10px;
  --r-ctl: 8px;
  --r-btn: 999px;
  --pad: 16px;
  --gap: 16px;
  --bw: 1px;
  --b-alpha: 14%;
  --shadow: 0;
  --surface: 0.025;
  --glass: 0;
  --blur: 16;
  --fs: 14px;
  --grad-i: 0.18;
  --grad-t: 140s;
  --surge: 0.7;
  --surge-t: 1.1s;
  --acc-dl: 0; --bg-h: 250; --bg-c: 0.004; --card-c: 0;
  --edge-col: var(--fg); --edge-tint: 0%; --bstyle: solid; --cs: round;
  --shadow-col: #000; --glow: 0; --glow-size: 18px; --glow-col: oklch(0.72 0.16 var(--acc-h)); --inner: 0; --inner-shadow: 0;
  --good-glow: 0; --good-glow-size: 10px;
  --g1: #5b8ac7; --g2: #9a73b5; --g3: #3f9c9a; --g-size: 70vmax; --g-blur: 60px; --g-move: 1; --burst-col: #8fb3f0;

  --bg-l: 0.985;
  --card-l: 1;
  --surf-dir: -1;
  --p-l0: 0.205;
  --p-l1: 0.55;
  --fg: oklch(0.145 0 0);
  --muted-fg: oklch(0.52 0 0);
  --primary-fg: oklch(0.985 0 0);
  --good-theme: oklch(0.6 0.15 155);
  --good: var(--good-theme);
  --good-2-theme: color-mix(in oklch, var(--good-theme) 45%, oklch(0.66 0.12 190));
  --good-2: var(--good-2-theme);
  --warn: oklch(0.66 0.14 70);
  --danger: oklch(0.577 0.245 27.3);
  --shadow-rgb: 0 0 0;
  --rail: oklch(0.96 0 0);

  --bg: oklch(var(--bg-l) var(--bg-c) var(--bg-h));
  --card: oklch(calc(var(--card-l) + var(--surface) * var(--surf-dir)) calc(var(--card-c) + var(--acc-c) * 0.08) var(--bg-h) / calc(1 - var(--glass) * 0.6));
  --line: color-mix(in oklch, color-mix(in oklch, var(--edge-col) var(--edge-tint), var(--fg)) var(--b-alpha), transparent);
  --well: color-mix(in oklch, var(--fg) 5%, transparent);
  --well-strong: color-mix(in oklch, var(--fg) 9%, transparent);
  --primary: oklch(calc(var(--p-l0) + (var(--p-l1) + var(--acc-dl) - var(--p-l0)) * min(1, var(--acc-c) / 0.05)) var(--acc-c) var(--acc-h));
  --accent-soft: oklch(0.7 calc(max(var(--acc-c), 0.02)) var(--acc-h) / 0.16);
  --elev: 0 calc(1px + 14px * var(--shadow)) calc(2px + 38px * var(--shadow)) color-mix(in srgb, var(--shadow-col) calc((0.04 + 0.4 * var(--shadow)) * 100%), transparent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-l: 0.18; --card-l: 0.205; --surf-dir: 1; --p-l0: 0.922; --p-l1: 0.72;
    --fg: oklch(0.985 0 0); --muted-fg: oklch(0.74 0 0); --primary-fg: oklch(0.2 0 0);
    --good-theme: oklch(0.74 0.16 155); --warn: oklch(0.8 0.14 75); --danger: oklch(0.704 0.191 22.2);
    --rail: oklch(0.22 0 0);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-l: 0.18; --card-l: 0.205; --surf-dir: 1; --p-l0: 0.922; --p-l1: 0.72;
  --fg: oklch(0.985 0 0); --muted-fg: oklch(0.74 0 0); --primary-fg: oklch(0.2 0 0);
  --good-theme: oklch(0.74 0.16 155); --warn: oklch(0.8 0.14 75); --danger: oklch(0.704 0.191 22.2);
  --rail: oklch(0.22 0 0);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs)/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
.muted { color: var(--muted-fg); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- ambient gradient ------------------------------------------- */
#aura { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#aura i {
  position: absolute; width: var(--g-size); height: var(--g-size); border-radius: 50%;
  filter: blur(var(--g-blur)); opacity: var(--grad-i);
  transition: opacity .9s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
  animation: drift var(--grad-t) ease-in-out infinite alternate;
}
#aura i:nth-child(1) { left: -20vmax; top: -25vmax; background: radial-gradient(circle, var(--g1) 0%, transparent 62%); }
#aura i:nth-child(2) { right: -25vmax; top: 10vmax; background: radial-gradient(circle, var(--g2) 0%, transparent 62%); animation-delay: calc(var(--grad-t) * -0.33); animation-name: drift2; }
#aura i:nth-child(3) { left: 10vmax; bottom: -35vmax; background: radial-gradient(circle, var(--g3) 0%, transparent 62%); animation-delay: calc(var(--grad-t) * -0.66); }
@keyframes drift { 0% { transform: translate(0,0) rotate(0) scale(1); } 50% { transform: translate(calc(14vmax * var(--g-move)), calc(8vmax * var(--g-move))) rotate(calc(40deg * var(--g-move))) scale(1.08); } 100% { transform: translate(calc(-6vmax * var(--g-move)), calc(16vmax * var(--g-move))) rotate(calc(80deg * var(--g-move))) scale(.96); } }
@keyframes drift2 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(calc(-16vmax * var(--g-move)), calc(6vmax * var(--g-move))) scale(1.12); } 100% { transform: translate(calc(-4vmax * var(--g-move)), calc(-10vmax * var(--g-move))) scale(.94); } }
@keyframes spin { to { transform: rotate(360deg); } }
:root[data-gmode="off"] #aura { display: none; }
:root[data-gmode="aurora"] #aura i { width: calc(var(--g-size) * 1.9); height: calc(var(--g-size) * 0.42); }
:root[data-gmode="aurora"] #aura i:nth-child(1) { left: -40vmax; top: -6vmax; }
:root[data-gmode="aurora"] #aura i:nth-child(2) { right: -50vmax; top: 22vmax; }
:root[data-gmode="aurora"] #aura i:nth-child(3) { left: -20vmax; bottom: -8vmax; }
:root[data-gmode="conic"] #aura i:nth-child(1) { left: 50%; top: 50%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; background: conic-gradient(from 0deg, var(--g1), var(--g2), var(--g3), var(--g1)); animation: spin var(--grad-t) linear infinite; }
:root[data-gmode="conic"] #aura i:nth-child(n+2) { display: none; }
:root[data-gmode="mesh"] #aura { background: linear-gradient(135deg, color-mix(in srgb, var(--g1) calc(var(--grad-i) * 60%), transparent), transparent 50%, color-mix(in srgb, var(--g3) calc(var(--grad-i) * 60%), transparent)); }
:root[data-gmode="mesh"] #aura i { width: calc(var(--g-size) * .55); height: calc(var(--g-size) * .55); }
:root:not([data-bmode="sweep"]):not([data-bmode="off"]) body.surge #aura i { opacity: min(1, calc(var(--grad-i) + var(--surge))); transform: scale(1.3) rotate(25deg); transition-duration: calc(var(--surge-t) * .45); }
#sweep {
  position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0;
  background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--burst-col) 55%, transparent) 50%, transparent 65%);
  background-size: 300% 100%; background-position: 110% 0;
}
:root:not([data-bmode="glow"]):not([data-bmode="off"]) body.surge #sweep { animation: sweep var(--surge-t) cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes sweep { 0% { opacity: 0; background-position: 110% 0; } 25% { opacity: calc(var(--surge) * .9); } 100% { opacity: 0; background-position: -10% 0; } }

/* ---------- lab chrome ------------------------------------------------- */
.lab { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding-inline: 16px; padding-block: 12px 32px; max-width: 1560px; margin: 0 auto; }
.topbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.topbar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.topbar .hint { font-size: 12px; }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--well); border: var(--bw) solid var(--line); border-radius: calc(var(--r-btn) + 3px); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: var(--r-btn); cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--muted-fg); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgb(var(--shadow-rgb) / .18); }
.seg button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .switch:focus-visible, .row-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Mock of Radium's window: icon rail, settings menu, page. */
.frame { display: grid; grid-template-columns: 48px 190px minmax(0, 1fr); min-height: 760px; border: var(--bw) solid var(--line); border-radius: calc(var(--r-card) + 6px); overflow: hidden; background: color-mix(in oklch, var(--bg) 70%, transparent); }
.frame.menu-collapsed { grid-template-columns: 48px minmax(0, 1fr); }
.frame.menu-collapsed .menu { display: none; }
.rail { background: var(--rail); border-right: var(--bw) solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 14px; }
.rail .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--fg); color: var(--bg); font: 700 15px/26px "Inter", sans-serif; text-align: center; }
.rail span { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--muted-fg); opacity: .7; }
.rail span.on { background: var(--muted-fg); }
.menu { padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 500; }
.menu a { padding: 5px 10px; border-radius: var(--r-ctl); color: var(--fg); text-decoration: none; }
.menu a.active { background: color-mix(in oklch, var(--fg) 16%, transparent); }
.menu .cap { margin-top: 14px; padding: 0 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); }
.page { padding: 20px; display: flex; flex-direction: column; gap: var(--gap); transition: opacity .38s ease, transform .38s ease, filter .38s ease; min-width: 0; }
.page.closing { opacity: 0; transform: translateY(8px) scale(.985); filter: blur(3px); }
.page-title { display: flex; align-items: baseline; gap: 10px; }
.page-title h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

/* ---------- surfaces ---------------------------------------------------- */
.card {
  background: var(--card); border: var(--bw) var(--bstyle) var(--line); border-radius: var(--r-card);
  box-shadow: var(--elev), 0 0 var(--glow-size) color-mix(in srgb, var(--glow-col) calc(var(--glow) * 100%), transparent), 0 0 calc(var(--glow-size) * 2.2) color-mix(in srgb, var(--glow-col) calc(var(--glow) * 40%), transparent), inset 0 1px 0 rgb(255 255 255 / calc(var(--inner) * 0.55)), inset 0 2px 14px rgb(0 0 0 / calc(var(--inner-shadow) * 0.4));
  padding: var(--pad);
  backdrop-filter: blur(calc(var(--glass) * var(--blur) * 1px)); -webkit-backdrop-filter: blur(calc(var(--glass) * var(--blur) * 1px));
  min-width: 0;
}
.card.sub { background: var(--well); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
:root.size-sm { --pad: 12px; }
.card, .dialog, .combo-list, .frame, .stat, .model, .logs, .profile-bar { corner-shape: var(--cs); }

.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.head .ident { display: flex; align-items: center; gap: 12px; min-width: 0; }
.head .mark { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 0 0 var(--bw) var(--line); }
.head .name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.head .meta { font-size: 12px; color: var(--muted-fg); }
.head .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 7px; border-radius: 999px; background: color-mix(in oklch, var(--good) 16%, transparent); color: var(--good); box-shadow: 0 0 var(--good-glow-size) color-mix(in srgb, var(--good) calc(var(--good-glow) * 90%), transparent), inset 0 0 0 1px color-mix(in srgb, var(--good) calc(var(--good-glow) * 60%), transparent); text-shadow: 0 0 calc(var(--good-glow-size) * .6) color-mix(in srgb, var(--good) calc(var(--good-glow) * 100%), transparent); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in oklch, currentColor 25%, transparent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.stat { flex: 1 1 130px; padding: 8px 12px; border-radius: var(--r-ctl); background: var(--well); }
.stat b { display: block; font-size: 15px; font-weight: 600; }
.stat small { font-size: 11.5px; color: var(--muted-fg); }
.meter { height: 4px; border-radius: 4px; background: var(--well-strong); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), var(--good-2)); border-radius: inherit; box-shadow: 0 0 var(--good-glow-size) color-mix(in srgb, var(--good-2) calc(var(--good-glow) * 100%), transparent); }
.meter { overflow: visible; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--r-btn); border: var(--bw) solid var(--line); background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, transform .1s; }
.btn:hover { background: var(--well-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost { border-color: transparent; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-ctl); color: var(--muted-fg); cursor: pointer; }
.icon-btn:hover { background: var(--well-strong); color: var(--fg); }
svg.i { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Sections (collapsible) */
.section { border-top: var(--bw) solid var(--line); }
.section > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 12px 0; cursor: pointer; font-weight: 600; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary .chev { transition: transform .2s; }
.section:not([open]) > summary .chev { transform: rotate(-90deg); }
.section > summary .sum { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted-fg); }
.section-body { padding-bottom: 14px; }

/* Models */
.dl { display: flex; gap: 8px; flex-wrap: wrap; }
.dl .combo { flex: 1 1 260px; }
.models { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.model { border-radius: var(--r-ctl); background: var(--well); border: var(--bw) solid transparent; }
.model.open { border-color: var(--line); }
.model-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; }
.row-toggle { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer; padding: 0; border-radius: var(--r-ctl); }
.model-name { font-weight: 600; font-size: 13.5px; }
.model-sub { font-size: 12px; color: var(--muted-fg); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--well-strong); color: var(--fg); white-space: nowrap; }
.tag.mem { background: color-mix(in oklch, var(--good-2) 18%, transparent); color: var(--good-2); box-shadow: 0 0 var(--good-glow-size) color-mix(in srgb, var(--good-2) calc(var(--good-glow) * 90%), transparent); text-shadow: 0 0 calc(var(--good-glow-size) * .6) color-mix(in srgb, var(--good-2) calc(var(--good-glow) * 100%), transparent); }
.tag.cap { background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.model-detail { padding: 2px 12px 14px 38px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
.model-detail h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; }
.model-detail ul { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 12.5px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 10px; }
.facts dt { color: var(--muted-fg); }
.facts dd { margin: 0; }
.quant { font-size: 12px; }
.qscale { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 6px 0 4px; }
.qscale button { border: 0; padding: 6px 0 5px; border-radius: 5px; background: var(--well-strong); cursor: pointer; font: 500 10.5px "JetBrains Mono", monospace; color: var(--muted-fg); }
.qscale button.cur { background: var(--primary); color: var(--primary-fg); }
.qscale button.sel:not(.cur) { box-shadow: inset 0 0 0 1.5px var(--primary); color: var(--fg); }
.qnote { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 6px; }
.fit-ok { color: var(--good); text-shadow: 0 0 calc(var(--good-glow-size) * .8) color-mix(in srgb, var(--good) calc(var(--good-glow) * 100%), transparent); } .fit-two { color: var(--warn); } .fit-no { color: var(--danger); }

/* Settings */
.groups { display: grid; gap: var(--gap); }
.group-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin: 0 0 4px; }
.group-title svg { color: var(--muted-fg); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; }
.setting + .setting { border-top: var(--bw) solid color-mix(in oklch, var(--fg) calc(var(--b-alpha) * .6), transparent); }
.setting .t { font-size: 13px; font-weight: 500; }
.setting .d { font-size: 11.5px; color: var(--muted-fg); margin-top: 1px; }
.setting .d code { font-size: 10.5px; opacity: .8; }
.setting { flex-wrap: wrap; }
.setting > :first-child { flex: 1 1 170px; min-width: 0; }
.setting .ctl { flex: none; max-width: 100%; }
.setting.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.setting.stack > :first-child { flex: none; }
.adv-badge { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-fg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

.input, .textarea { height: 32px; padding: 0 10px; border-radius: var(--r-ctl); border: var(--bw) solid var(--line); background: var(--well); outline: none; min-width: 0; }
.textarea { height: auto; padding: 8px 10px; resize: vertical; width: 100%; font-family: "JetBrains Mono", monospace; font-size: 12px; }
.input:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--accent-soft); }
.stepper { display: inline-flex; align-items: center; border: var(--bw) solid var(--line); border-radius: var(--r-ctl); overflow: hidden; background: var(--well); height: 32px; }
.stepper input { width: 74px; border: 0; background: transparent; text-align: center; height: 100%; outline: none; }
.stepper button { width: 30px; height: 100%; border: 0; border-left: var(--bw) solid var(--line); background: transparent; cursor: pointer; color: var(--muted-fg); }
.stepper button:hover { background: var(--well-strong); color: var(--fg); }
.switch { width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--well-strong); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--primary-fg); }

/* Combobox */
.combo { position: relative; min-width: 180px; }
.combo .input { width: 100%; padding-right: 30px; }
.combo .caret { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted-fg); }
.combo-list { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; max-height: 240px; overflow: auto; padding: 4px; background: oklch(calc(var(--card-l) + 0.03 * var(--surf-dir)) 0 0); border: var(--bw) solid var(--line); border-radius: var(--r-ctl); box-shadow: 0 12px 32px rgb(var(--shadow-rgb) / .3); }
.combo-list [role="option"] { padding: 7px 9px; border-radius: calc(var(--r-ctl) - 3px); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.combo-list [role="option"] small { color: var(--muted-fg); }
.combo-list [role="option"][aria-selected="true"] { background: var(--well-strong); }
.combo-list .empty { padding: 8px 9px; color: var(--muted-fg); font-size: 12.5px; }

.footer-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; margin-top: 4px; border-top: var(--bw) solid var(--line); }
.footer-bar .grow { flex: 1; }
.footer-bar .dirty { font-size: 12px; color: var(--warn); }

.progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; }
.bar { flex: 1; height: 5px; border-radius: 5px; background: var(--well-strong); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); transition: width .3s; }

.logs { max-height: 220px; overflow: auto; padding: 10px 12px; border-radius: var(--r-ctl); background: color-mix(in oklch, var(--bg) 80%, black 20%); font-size: 11.5px; line-height: 1.6; color: var(--muted-fg); white-space: pre; }
.logs .lvl { color: var(--good-2); }

/* Layout variants */
.v-tiles .tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--gap); }
.v-tiles .model-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; margin-top: 12px; }
.v-tiles .model-grid { align-items: start; }
.v-tiles .model-grid .model.open { grid-column: 1 / -1; }
.v-split .split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.v-split .split > .col { display: grid; gap: var(--gap); }
.v-split .model-detail { grid-template-columns: 1fr; }
.tabs-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.v-tabs .tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--gap); }

/* Dialog */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .18s ease; }
.dialog { width: min(440px, 100%); background: oklch(calc(var(--card-l) + 0.01 * var(--surf-dir)) 0 0); border: var(--bw) solid var(--line); border-radius: calc(var(--r-card) + 2px); box-shadow: 0 24px 60px rgb(var(--shadow-rgb) / .45); animation: pop .22s cubic-bezier(.2,.9,.3,1.2); overflow: hidden; }
.dialog .body { padding: 18px 18px 16px; }
.dialog h3 { margin: 0 0 6px; font-size: 15.5px; font-weight: 600; }
.dialog p { margin: 0; font-size: 13px; color: var(--muted-fg); }
.dialog .list { margin-top: 10px; font-size: 12px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: var(--bw) solid var(--line); background: var(--well); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }

.toast { position: fixed; z-index: 60; right: 20px; bottom: 20px; max-width: 340px; padding: 10px 14px; border-radius: var(--r-ctl); background: oklch(calc(var(--card-l) + 0.04 * var(--surf-dir)) 0 0); border: var(--bw) solid var(--line); box-shadow: 0 12px 30px rgb(var(--shadow-rgb) / .3); font-size: 13px; animation: pop .2s ease; }

/* ---------- style lab panel --------------------------------------------- */
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 14px; background: oklch(calc(var(--card-l) + 0.015 * var(--surf-dir)) 0 0); border: 1px solid color-mix(in oklch, var(--fg) 12%, transparent); font-size: 12.5px; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 600; }
.panel fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 9px; }
.panel legend { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; margin-bottom: 4px; padding: 0; }
.knob { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.knob label { font-weight: 500; }
.knob output { font: 500 11px "JetBrains Mono", monospace; color: var(--muted-fg); }
.knob input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--fg); margin: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 5px; }
.presets button { border: 1px solid color-mix(in oklch, var(--fg) 14%, transparent); background: transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.presets button:hover { background: var(--well-strong); }
.chipset { display: flex; flex-wrap: wrap; gap: 4px; }
.chipset button { border: 1px solid color-mix(in oklch, var(--fg) 14%, transparent); background: transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.chipset button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }
.panel .note { font-size: 11.5px; color: var(--muted-fg); }
.panel textarea { width: 100%; height: 120px; font: 11px/1.45 "JetBrains Mono", monospace; border-radius: 8px; border: 1px solid color-mix(in oklch, var(--fg) 14%, transparent); background: var(--well); padding: 8px; resize: vertical; }

/* ---------- edit tools: grab, move, resize, reshape, comment ---------- */
:root { --ed: oklch(0.62 0.19 255); --pin: oklch(0.78 0.15 70); --ed-surface: oklch(calc(var(--card-l) + 0.012 * var(--surf-dir)) 0.004 var(--acc-h)); }
body.ed-on #frame { touch-action: none; }
body.ed-on #frame * { user-select: none; -webkit-user-select: none; }
body[data-ed="move"] #frame, body[data-ed="move"] #frame * { cursor: default !important; }
body[data-ed="comment"] #frame, body[data-ed="comment"] #frame * { cursor: crosshair !important; }
body.ed-dragging, body.ed-dragging * { cursor: grabbing !important; }
#ed { position: fixed; inset: 0; z-index: 45; pointer-events: none; font-size: 12.5px; }
#ed [hidden] { display: none !important; }
#ed .ed-box { position: fixed; left: 0; top: 0; pointer-events: none; border: 1.5px dashed var(--ed); border-radius: 4px; }
#ed .ed-box.sel { border-style: solid; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ed) 18%, transparent); }
#ed .ed-box > .lbl { position: absolute; left: -1.5px; bottom: calc(100% + 3px); max-width: min(60vw, 420px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 10.5px/18px "JetBrains Mono", ui-monospace, monospace; color: #fff; background: var(--ed); padding: 0 6px; border-radius: 4px; }
#ed .ed-h { position: absolute; width: 9px; height: 9px; background: #fff; border: 1.5px solid var(--ed); border-radius: 2px; pointer-events: auto; }
#ed .ed-h[data-h="n"] { top: -5.5px; left: calc(50% - 4.5px); cursor: ns-resize; }
#ed .ed-h[data-h="s"] { bottom: -5.5px; left: calc(50% - 4.5px); cursor: ns-resize; }
#ed .ed-h[data-h="e"] { right: -5.5px; top: calc(50% - 4.5px); cursor: ew-resize; }
#ed .ed-h[data-h="w"] { left: -5.5px; top: calc(50% - 4.5px); cursor: ew-resize; }
#ed .ed-h[data-h="ne"] { right: -5.5px; top: -5.5px; cursor: nesw-resize; }
#ed .ed-h[data-h="nw"] { left: -5.5px; top: -5.5px; cursor: nwse-resize; }
#ed .ed-h[data-h="se"] { right: -5.5px; bottom: -5.5px; cursor: nwse-resize; }
#ed .ed-h[data-h="sw"] { left: -5.5px; bottom: -5.5px; cursor: nesw-resize; }
#ed .ed-r { position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ed); pointer-events: auto; cursor: pointer; }
#ed .ed-r:hover { transform: scale(1.25); }
#ed .sel.reorder .ed-h, #ed .sel.reorder .ed-r { display: none; }
#ed-drop { position: fixed; left: 0; top: 0; background: var(--ed); border-radius: 2px; box-shadow: 0 0 0 2px color-mix(in oklch, var(--ed) 25%, transparent); pointer-events: none !important; }
#ed .ed-surface { background: var(--ed-surface); border: 1px solid var(--line); box-shadow: 0 14px 40px rgb(var(--shadow-rgb) / .28); color: var(--fg); }
#ed-bar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; max-width: calc(100vw - 16px); pointer-events: auto; }
#ed-hint { position: fixed; left: 50%; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 3px 12px; border-radius: 999px; font-size: 11.5px; color: var(--muted-fg); white-space: nowrap; max-width: calc(100vw - 16px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
#ed button { font: inherit; color: inherit; }
.ed-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--well); }
.ed-seg button, .ed-tg, .ed-ic { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; }
.ed-ic { width: 28px; padding: 0; justify-content: center; }
.ed-seg button[aria-pressed="true"] { background: var(--ed); color: #fff; }
.ed-seg.sub button[aria-pressed="true"] { background: var(--ed-surface); color: var(--fg); box-shadow: 0 1px 3px rgb(var(--shadow-rgb) / .2); }
.ed-tg[aria-pressed="true"] { background: color-mix(in oklch, var(--ed) 16%, transparent); color: color-mix(in oklch, var(--ed) 70%, var(--fg)); }
.ed-seg button:hover:not([aria-pressed="true"]), .ed-tg:hover, .ed-ic:hover:not(:disabled) { background: var(--well-strong); }
.ed-ic:disabled { opacity: .35; cursor: default; }
.ed-sep { width: 1px; height: 18px; background: var(--line); margin-inline: 2px; }
.ed-count { min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--pin); color: oklch(0.25 0.05 60); font-size: 10.5px; line-height: 17px; text-align: center; }
.ed-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin: 0 8px 0 4px; }
.ed-dot.on { background: var(--good); }
#ed button:focus-visible, #ed textarea:focus-visible, #ed input:focus-visible { outline: 2px solid var(--ed); outline-offset: 1px; }
#ed-chip { position: fixed; left: 0; top: 0; display: flex; gap: 1px; padding: 3px; border-radius: 10px; pointer-events: auto; }
#ed-chip .ed-ic { height: 26px; width: 26px; border-radius: 7px; }
#ed-chip .ed-ic.danger { color: var(--danger); }
.ed-pin { position: fixed; left: 0; top: 0; width: 24px; height: 24px; padding: 0; border-radius: 50% 50% 50% 3px; border: 2px solid var(--ed-surface); background: var(--pin); color: oklch(0.25 0.05 60); font: 700 11px/20px Inter, system-ui, sans-serif; text-align: center; cursor: pointer; pointer-events: auto; box-shadow: 0 3px 10px rgb(0 0 0 / .3); display: grid; place-items: center; }
.ed-pin svg.i { width: 12px; height: 12px; stroke-width: 3; }
.ed-pin.done { background: color-mix(in oklch, var(--fg) 30%, var(--ed-surface)); color: var(--ed-surface); opacity: .75; }
.ed-pin.active, .ed-pin.new { outline: 2px solid var(--ed); outline-offset: 1px; }
.ed-pin.new { background: var(--ed); color: #fff; pointer-events: none; }
.ed-pin.flash { animation: pinflash 1.2s ease 2; }
@keyframes pinflash { 50% { transform-origin: bottom left; box-shadow: 0 0 0 8px color-mix(in oklch, var(--pin) 40%, transparent); } }
#ed-pop { position: fixed; left: 0; top: 0; width: 300px; max-width: calc(100vw - 16px); max-height: calc(100vh - 100px); overflow: auto; padding: 12px; border-radius: 12px; display: grid; gap: 8px; pointer-events: auto; animation: pop .16s ease; }
.ed-pop-h, .ed-dh { display: flex; align-items: center; gap: 8px; }
.ed-tgt { font: 500 11px/1.4 "JetBrains Mono", ui-monospace, monospace; color: var(--muted-fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ed-x { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; cursor: pointer; color: var(--muted-fg); flex: none; }
.ed-x:hover { background: var(--well-strong); }
.ed-num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--pin); color: oklch(0.25 0.05 60); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.done .ed-num, .ed-num.done { background: color-mix(in oklch, var(--fg) 25%, transparent); color: var(--fg); }
.ed-kinds { display: flex; flex-wrap: wrap; gap: 4px; }
.ed-kinds button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 11.5px; }
.ed-kinds button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }
#ed textarea { width: 100%; min-height: 70px; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: var(--well); padding: 8px 10px; font: 13px/1.45 Inter, system-ui, sans-serif; color: var(--fg); }
#ed textarea#ed-reply { min-height: 44px; }
.ed-pop-f { display: flex; align-items: center; gap: 6px; }
.ed-pop-f .grow { flex: 1; }
.ed-pop-f .hint { font-size: 11px; color: var(--muted-fg); }
.ed-body { white-space: pre-wrap; margin: 0; font-size: 13.5px; line-height: 1.45; }
.ed-meta { font-size: 11px; color: var(--muted-fg); }
.ed-tag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted-fg); }
.ed-reply { padding: 7px 9px; border-radius: 8px; background: var(--well); white-space: pre-wrap; font-size: 12.5px; }
.ed-reply b { display: block; font-size: 11px; margin-bottom: 1px; }
.ed-reply.claude { background: color-mix(in oklch, var(--ed) 12%, transparent); }
#ed-drawer, #ed-insp { position: fixed; top: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); overflow: auto; padding: 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; animation: pop .18s ease; }
#ed-drawer { right: 12px; width: 350px; max-width: calc(100vw - 24px); }
#ed-insp { left: 12px; width: 250px; max-width: calc(100vw - 24px); bottom: auto; max-height: calc(100vh - 100px); }
#ed h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; }
#ed section { display: grid; gap: 4px; }
#ed .muted { color: var(--muted-fg); margin: 0; }
.ed-save { font-size: 11.5px; color: var(--muted-fg); display: flex; gap: 6px; align-items: center; }
.ed-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ed-go { width: 100%; display: flex; gap: 8px; align-items: flex-start; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px; cursor: pointer; }
.ed-go:hover { background: var(--well-strong); }
.ed-go > span:last-child { min-width: 0; display: grid; gap: 1px; }
.ed-li-t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 12.5px; }
.ed-go small, .ed-changes small { color: var(--muted-fg); font-size: 11px; }
.ed-list li.done .ed-li-t { text-decoration: line-through; opacity: .6; }
.ed-changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ed-changes li { display: flex; align-items: center; gap: 4px; padding: 5px 0; border-top: 1px solid color-mix(in oklch, var(--fg) 8%, transparent); }
.ed-changes li > span { flex: 1; min-width: 0; display: grid; overflow-wrap: anywhere; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.ed-f { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.ed-f label { font-weight: 500; }
.ed-f output { font: 500 11px "JetBrains Mono", monospace; color: var(--muted-fg); }
.ed-f input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--ed); }
.ed-xywh { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ed-xywh label { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; background: var(--well); font: 500 11px "JetBrains Mono", monospace; color: var(--muted-fg); }
.ed-xywh input { width: 100%; min-width: 0; border: 0; background: transparent; outline: none; font: 500 12px "JetBrains Mono", monospace; color: var(--fg); }
.ed-shapes { display: flex; flex-wrap: wrap; gap: 4px; }
.ed-shapes button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; }
.ed-shapes button[aria-pressed="true"] { background: var(--ed); color: #fff; border-color: transparent; }
@media (max-width: 560px) {
  #ed-bar .ed-seg button span, #ed-bar .ed-tg span { display: none; }
  #ed-bar .ed-seg button, #ed-bar .ed-tg { padding: 0 8px; }
  #ed-hint { display: none; }
  #ed-insp, #ed-motion { top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); max-height: 50vh; }
}
@media (prefers-reduced-motion: reduce) { #ed-pop, #ed-drawer, #ed-insp { animation: none; } .ed-pin.flash { animation: none; } }

/* ---------- style lab panel (sections, looks) ---------- */
.lab-head { display: flex; align-items: center; gap: 8px; }
.lab-head h2 { flex: 1; }
.lab-sec { border-top: 1px solid color-mix(in oklch, var(--fg) 10%, transparent); }
.lab-sec > summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 9px 0; cursor: pointer; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; }
.lab-sec > summary::-webkit-details-marker { display: none; }
.lab-sec > summary span { flex: 1; }
.lab-sec > summary .chev, .ed-sec > summary .chev, .fx > summary .chev { transition: transform .2s; width: 13px; height: 13px; }
.lab-sec:not([open]) > summary .chev, .ed-sec:not([open]) > summary .chev, .fx:not([open]) > summary .chev { transform: rotate(-90deg); }
.lab-body { display: grid; gap: 10px; padding-bottom: 12px; }
.lab-sub { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; margin-top: 4px; }
.mini { border: 1px solid color-mix(in oklch, var(--fg) 14%, transparent); background: transparent; border-radius: 6px; padding: 1px 7px; cursor: pointer; font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
.mini:hover:not(:disabled) { background: var(--well-strong); }
.mini:disabled { opacity: .4; cursor: default; }
.mini.danger { color: var(--danger); padding: 1px 4px; }
.mini svg.i { width: 12px; height: 12px; }
.mini[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.save-row { display: flex; gap: 6px; }
.save-row .input { flex: 1; height: 28px; font-size: 12.5px; }
.look-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.look-list li { display: flex; align-items: center; gap: 4px; }
.look-apply { flex: 1; min-width: 0; display: grid; text-align: left; border: 1px solid color-mix(in oklch, var(--fg) 10%, transparent); background: var(--well); border-radius: 8px; padding: 5px 8px; cursor: pointer; }
.look-apply:hover { background: var(--well-strong); }
.look-apply b { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.look-apply small { color: var(--muted-fg); font-size: 11px; }
.knob.color { grid-template-columns: 1fr auto; }
.cpick { display: inline-flex; align-items: center; gap: 6px; }
.cpick output { font: 500 11px "JetBrains Mono", monospace; color: var(--muted-fg); min-width: 54px; text-align: right; }
input[type="color"] { width: 30px; height: 24px; padding: 0; border: 1px solid color-mix(in oklch, var(--fg) 18%, transparent); border-radius: 6px; background: none; cursor: pointer; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
.knob.hue input[type="range"] { accent-color: oklch(0.65 0.15 var(--acc-h)); }
.panel .chipset button { font-size: 11.5px; }

/* ---------- editor: inspector sections, motion panel ---------- */
.ed-sec { border-top: 1px solid color-mix(in oklch, var(--fg) 9%, transparent); }
.ed-sec > summary, .fx > summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 8px 0; cursor: pointer; font-weight: 600; font-size: 12px; }
.ed-sec > summary::-webkit-details-marker, .fx > summary::-webkit-details-marker { display: none; }
.ed-sec-b, .fx-body { display: grid; gap: 8px; padding-bottom: 10px; }
.ed-lbl { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); font-weight: 600; }
.ed-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed-f { position: relative; }
.ed-f.set label::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ed); margin-left: 6px; vertical-align: middle; }

.ed-f:not(.color) output { margin-right: 16px; }

.switch.sm { width: 30px; height: 18px; }

#ed .switch[aria-checked="true"] { background: var(--ed); }
#ed .switch[aria-checked="true"]::after { background: #fff; }

/* Effect overlays: follow an element while an effect plays. */
@property --fx-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.fx-o { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 44; }
.fx-o.fx-clip { overflow: hidden; }
.fx-ring { position: absolute; inset: calc(var(--w) * -0.5); border-radius: inherit; corner-shape: inherit; padding: var(--w);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.fx-o:has(.fx-ring) { filter: drop-shadow(0 0 var(--g) var(--c)); }
.fx-chase { background: conic-gradient(from var(--fx-a), transparent 0%, color-mix(in srgb, var(--c) 30%, transparent) calc(var(--arc) * 0.6%), var(--c) calc(var(--arc) * 1%), transparent calc(var(--arc) * 1% + 0.6%)); }
.fx-draw { background: conic-gradient(from -90deg, var(--c) var(--fx-a), transparent 0); }
.fx-dot { position: absolute; border-radius: 50%; pointer-events: none; }
.fx-band { position: absolute; inset: -20% -10%; }

/* ---------- runtime: profiles and per-model settings ---------- */
.profile-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px; border-radius: var(--r-ctl); background: var(--well); }
.profile-bar .pb-l { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.profile-bar .pb-l svg { color: var(--muted-fg); }
.profile-bar .pb-note { font-size: 11.5px; color: var(--muted-fg); margin-left: auto; }
.profile-bar .combo { min-width: 0; }
.model-cfg { grid-column: 1 / -1; border-top: var(--bw) solid var(--line); padding-top: 12px; }

(() => {

    { id: 'gpus', title: 'GPUs', icon: 'gpu', rows: [
      { key: 'gpus', t: 'GPU', d: 'Which card Ollama may use.', env: 'CUDA_VISIBLE_DEVICES', ctl: () => combo('gpu', GPUS, { value: S.draft.gpus, onPickKey: 'gpus', width: 200 }) },
      { key: 'spread', t: 'Spread across both cards', d: 'Split every model over both 3090s, even when it fits on one.', env: 'OLLAMA_SCHED_SPREAD', adv: true, ctl: () => sw('spread', 'Spread across both cards') },
      { key: 'parallel', t: 'Parallel requests', d: '0 keeps Ollama’s default.', env: 'OLLAMA_NUM_PARALLEL', adv: true, ctl: () => stepper('parallel', 1, 'Parallel requests') },
      { key: 'maxLoaded', t: 'Models per GPU', d: '0 keeps Ollama’s default.', env: 'OLLAMA_MAX_LOADED_MODELS', adv: true, ctl: () => stepper('maxLoaded', 1, 'Models per GPU') },
    ] },
    { id: 'server', title: 'Server', icon: 'server', rows: [
      { key: 'autoStart', t: 'Start with Radium', d: 'Start when Radium opens and stop when it quits.', ctl: () => sw('autoStart', 'Start with Radium') },
      { key: 'noCloud', t: 'Keep everything local', d: 'Turn off Ollama’s cloud models and web search.', env: 'OLLAMA_NO_CLOUD', adv: true, ctl: () => sw('noCloud', 'Keep everything local') },
      { key: 'network', t: 'Allow other computers', d: 'Ollama has no password: only on a network you trust.', env: 'OLLAMA_HOST', adv: true, ctl: () => sw('network', 'Allow other computers') },
      { key: 'port', t: 'Port', d: '11434 is Ollama’s standard port.', env: 'OLLAMA_HOST', adv: true, ctl: () => stepper('port', 1, 'Port') },
      { key: 'modelsDir', t: 'Models folder', d: 'Empty keeps C:\\Users\\Warwick\\.ollama\\models.', env: 'OLLAMA_MODELS', adv: true, ctl: () => text('modelsDir', 'Default folder', 'Models folder') },
      { key: 'extraEnv', t: 'Other variables', d: 'One KEY=VALUE per line, applied last.', adv: true, stack: true, ctl: () => `<textarea class="textarea" id="ta-extraEnv" rows="3" placeholder="OLLAMA_DEBUG=1" data-act="text" data-key="extraEnv" aria-label="Other variables">${esc(S.draft.extraEnv)}</textarea>` },
    ] },
  ];

  function settingRow(r) {
    return `<div class="setting${r.stack ? ' stack' : ''}" data-k="set:${r.key}"><div><div class="t">${r.t}${r.adv ? '<span class="adv-badge">Advanced</span>' : ''}</div><div class="d">${r.d}${r.env ? ` <code class="mono">${r.env}</code>` : ''}</div></div><div class="ctl">${r.ctl()}</div></div>`;
  }
  function groupBlock(g, asCard) {
    const rows = g.rows.filter((r) => S.advanced || !r.adv);
    if (!rows.length) return '';
    const inner = `<div class="group-title">${icon(g.icon)}${g.title}</div>${rows.map(settingRow).join('')}`;
    return asCard ? `<div class="card sub" data-k="group:${g.id}">${inner}</div>` : `<div data-k="group:${g.id}">${inner}</div>`;
  }
  function settingsFooter() {
    const d = dirtyKeys();
    const needsRestart = S.running && d.some((k) => k !== 'autoStart');
    return `<div class="footer-bar" data-k="footer">
      <button class="btn sm ghost" type="button" data-act="advanced">${S.advanced ? 'Hide advanced' : 'Show advanced (' + GROUPS.flatMap((g) => g.rows).filter((r) => r.adv).length + ')'}</button>
      <button class="btn sm ghost" type="button" data-act="copyenv">${icon('copy')}Copy as environment</button>
      <button class="btn sm ghost" type="button" data-act="ask-reset">${icon('reset')}Reset to defaults</button>
      <span class="grow"></span>
      ${d.length ? `<span class="dirty">${d.length} unsaved</span><button class="btn sm" type="button" data-act="discard">Discard</button>` : ''}
      <button class="btn sm primary" type="button" data-act="save" ${d.length ? '' : 'disabled'}>${needsRestart ? 'Save and restart' : 'Save'}</button>
    </div>`;
  }

  // ---------- blocks ----------
  function header(withStats) {
    const loaded = S.models.filter((m) => m.loaded);
    const vram = loaded.reduce((a, m) => a + m.loaded.vram, 0);
    return `<div class="head" data-k="head">
      <div class="ident"><div class="mark">${OLLAMA_MARK}</div><div><div style="display:flex;align-items:center;gap:8px"><span class="name">Ollama</span>${S.running ? '<span class="pill">Running in Radium</span>' : '<span class="tag">Stopped</span>'}</div>
      <div class="meta mono">v0.34.4 · 127.0.0.1:11434 · up 12 min</div></div></div>
      <div class="actions">
        ${S.running ? `<button class="btn" type="button" data-act="restart">${icon('restart')}Restart</button><button class="btn" type="button" data-act="ask-stop">${icon('stop')}Stop</button>` : `<button class="btn primary" type="button" data-act="start">${icon('play')}Start</button>`}
      </div>
    </div>
    ${withStats ? `<div class="stats" data-k="stats">
      <div class="stat" data-k="stat:models"><b class="tnum">${S.models.length}</b><small>models installed · ${gb(S.models.reduce((a, m) => a + sizeFor(m, QUANTS.find((q) => q.id === m.quant)), 0))}</small></div>
      <div class="stat" data-k="stat:memory"><b class="tnum">${loaded.length ? esc(loaded.map((m) => m.name).join(', ')) : 'None'}</b><small>in memory</small></div>
      <div class="stat" data-k="stat:vram"><b class="tnum">${vram.toFixed(1)} / 48 GB</b><small>VRAM on 2 × RTX 3090</small><div class="meter"><i style="width:${(vram / 48) * 100}%"></i></div></div>
      <div class="stat" data-k="stat:speed"><b class="tnum">38.6 tok/s</b><small>last reply</small></div>
    </div>` : ''}`;
  }

  function modelDetail(m) {
    const cur = QUANTS.find((q) => q.id === m.quant);
    const selId = S.quantPick[m.name] || m.quant;
    const sel = QUANTS.find((q) => q.id === selId);
    const size = sizeFor(m, sel);
    const [fitCls, fitText] = fit(size + (m.params > 1 ? 2 : 0));
    return `<div class="model-detail">
      <div>
        <h4>Good at</h4>
        <ul>${m.good.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>
        <dl class="facts">
          <dt>Family</dt><dd>${esc(m.family)}</dd>
          <dt>Parameters</dt><dd>${esc(m.paramsLabel)}</dd>
          <dt>Context window</dt><dd>${ctxLabel(m.ctx)}</dd>
          <dt>Downloaded</dt><dd>${m.downloaded}</dd>
        </dl>
      </div>
      <div class="quant">
        <h4>Quantization</h4>
        <div>Stored as <b class="mono">${cur.id}</b>: about ${cur.bpw} bits per weight instead of 16. Pick another level to compare.</div>
        <div class="qscale" role="group" aria-label="Quantization levels">${QUANTS.map((q) => `<button type="button" class="${q.id === cur.id ? 'cur' : ''} ${q.id === selId ? 'sel' : ''}" data-act="quant" data-m="${esc(m.name)}" data-q="${q.id}" aria-pressed="${q.id === selId}">${q.id.replace('_K_M', 'KM').replace('_K', 'K').replace('_0', '_0')}</button>`).join('')}</div>
        <div class="qnote"><span class="muted">Size</span><span class="tnum">≈ ${gb(size)} of weights${m.params > 1 ? ', plus about 2 GB for context' : ''}</span>
        <span class="muted">Quality</span><span>${sel.note}</span>
        <span class="muted">Fits</span><span class="${fitCls}">${fitText}</span></div>
      </div>
      ${modelCfgHtml(m)}
    </div>`;
  }

  function modelItem(m) {
    const open = !!S.open[m.name];
    const q = QUANTS.find((x) => x.id === m.quant);
    return `<div class="model${open ? ' open' : ''}" data-k="model:${esc(m.name)}">
      <div class="model-row">
        <button class="row-toggle" type="button" data-act="expand" data-m="${esc(m.name)}" aria-expanded="${open}">
          <span style="transition:transform .2s;display:inline-flex;${open ? '' : 'transform:rotate(-90deg)'}">${icon('chev')}</span>
          <span style="min-width:0"><span class="model-name">${esc(m.name)}</span>
            <span class="model-sub"> · ${esc(m.paramsLabel)} · <span class="mono">${m.quant}</span> · ${gb(sizeFor(m, q))}</span><br>
            <span class="chips" style="margin-top:4px">${m.caps.map((c) => `<span class="tag cap">${c}</span>`).join('')}${m.loaded ? `<span class="tag mem">In memory · ${m.loaded.vram} GB VRAM</span>` : ''}${S.mcfg[m.name] ? `<span class="tag cfg">${esc(mProfileOf(m.name))} settings</span>` : ''}</span></span>
        </button>
        ${m.caps.includes('Embeddings') ? '' : m.loaded ? `<button class="btn sm" type="button" data-act="unload" data-m="${esc(m.name)}">Unload</button>` : `<button class="btn sm" type="button" data-act="load" data-m="${esc(m.name)}">Load</button>`}
        <button class="icon-btn" type="button" aria-label="Delete ${esc(m.name)}" data-act="ask-delete" data-m="${esc(m.name)}">${icon('trash')}</button>
      </div>
      ${open ? modelDetail(m) : ''}
    </div>`;
  }

  function downloader() {
    return `<div class="dl" data-k="dl">${combo('dl', LIBRARY, { value: S.dl, onPickKey: '', placeholder: 'Download a model: qwen3:8b, hf.co/user/repo:Q4_K_M…', free: true, width: 9999 })}
      <button class="btn primary" type="button" data-act="pull" ${S.pull ? 'disabled' : ''}>${icon('download')}Download</button></div>
      ${S.pull ? `<div class="progress"><span class="mono">${esc(S.pull.model)}</span><div class="bar"><i style="width:${S.pull.pct}%"></i></div><span class="muted tnum" style="width:150px">${esc(S.pull.status)}</span><button class="btn sm ghost" type="button" data-act="cancel-pull">Cancel</button></div>` : ''}`;
  }
  const modelsList = (grid) => `<div class="${grid ? 'model-grid' : 'models'}" data-k="models">${S.models.map(modelItem).join('')}</div>`;
  const logsBlock = () => `<div class="logs mono" data-k="logs">${LOGS.map((l) => esc(l).replace('level=INFO', '<span class="lvl">level=INFO</span>')).join('\n')}</div>`;

  function section(id, title, sum, body) {
    return `<details class="section" ${S.sections[id] ? 'open' : ''} data-sec="${id}" data-k="sec:${id}"><summary>${icon('chev', 'i chev')}${title}<span class="sum">${sum}</span></summary><div class="section-body">${body}</div></details>`;
  }
  const modelsSum = () => `${S.models.length} installed · ${S.models.filter((m) => m.loaded).length} in memory`;

  // ---------- saved settings profiles (server) ----------
  // Built-in profiles only change the settings they name. Your own profiles
  // are a full snapshot of every setting.
  const SRV_PRESETS = [
    { id: 'p-default', name: 'Ollama defaults', builtin: true, full: true, values: { ...DEFAULTS } },
    { id: 'p-big', name: 'One big model', builtin: true, values: { contextLength: 65536, flashAttention: true, kvCacheType: 'q8_0', maxLoaded: 1, spread: true, keepAlive: '30m' } },
    { id: 'p-two', name: 'Two models side by side', builtin: true, values: { contextLength: 16384, flashAttention: true, kvCacheType: 'q8_0', maxLoaded: 2, parallel: 2, spread: false } },
    { id: 'p-games', name: 'Leave room for games', builtin: true, values: { overhead: 8192, keepAlive: '0', maxLoaded: 1, gpus: 'GPU-1' } },
  ];
  const allProfiles = () => [...SRV_PRESETS, ...S.profiles];
  const profileMatches = (p) => Object.entries(p.values).every(([k, v]) => S.draft[k] === v);
  function profileBar() {
    const cur = allProfiles().find((p) => p.id === S.profileId);
    const items = allProfiles().map((p) => [p.id, p.name, p.builtin ? 'built in' : 'yours']).concat([['__new', 'Save these settings as a profile…', '']]);
    return `<div class="profile-bar" data-k="profiles">
      <span class="pb-l">${icon('server')}Settings profile</span>
      ${S.naming != null
        ? `<input class="input" id="prof-name" data-act="prof-name" placeholder="Name, e.g. Coding day" value="${esc(S.naming)}" style="width:210px;max-width:100%" aria-label="Profile name"><button class="btn sm primary" type="button" data-act="prof-save">Save profile</button><button class="btn sm ghost" type="button" data-act="prof-cancel">Cancel</button>`
        : `${combo('prof', items, { value: S.profileId, placeholder: 'Custom settings', width: 240 })}${cur && !cur.builtin ? `<button class="btn sm ghost" type="button" data-act="prof-update" title="Replace this profile with the settings below">Update</button><button class="icon-btn" type="button" data-act="prof-del" aria-label="Delete profile ${esc(cur.name)}">${icon('trash')}</button>` : ''}`}
      <span class="pb-note">${cur ? (profileMatches(cur) ? 'Settings below match this profile' : 'Changed since you picked it') : 'Pick a profile to load it, then Save to apply'}</span>
    </div>`;
  }
  function pickProfile(id) {
    if (id === '__new') { S.naming = ''; S.combo = null; render(); const i = document.getElementById('prof-name'); if (i) i.focus(); return; }
    const p = allProfiles().find((x) => x.id === id); if (!p) return;
    S.draft = p.builtin && !p.full ? { ...S.draft, ...p.values } : { ...DEFAULTS, ...p.values };
    S.profileId = p.id; store.set('srv-profile', p.id); S.combo = null;
    render(); toast(`Loaded “${p.name}”. Save to apply it.`);
  }
  function saveProfile() {
    const name = (S.naming || '').trim() || `Profile ${S.profiles.length + 1}`;
    const id = 'u' + Date.now().toString(36);
    S.profiles.push({ id, name, values: { ...S.draft } });
    S.profileId = id; S.naming = null;
    store.set('srv-profiles', S.profiles); store.set('srv-profile', id);
    render(); toast(`Saved “${name}”`);
  }

  // ---------- per-model settings ----------
  // Sent with each request to that model as Ollama options, so one model's
  // settings never touch another's. Empty means "use the default".
  const MFIELDS = [
    { key: 'num_ctx', t: 'Context window', d: 'Tokens this model can see. Empty uses the server setting.', kind: 'step', step: 4096, def: null, fmt: (v) => (v ? ctxLabel(v) : 'server setting') },
    { key: 'temperature', t: 'Temperature', d: 'Higher is more creative, lower is more exact.', kind: 'range', min: 0, max: 2, step: 0.05, def: 0.8 },
    { key: 'top_p', t: 'Top P', d: 'Only consider the most likely words adding up to this share.', kind: 'range', min: 0, max: 1, step: 0.01, def: 0.9 },
    { key: 'top_k', t: 'Top K', d: 'Only consider this many likely words.', kind: 'range', min: 1, max: 200, step: 1, def: 40 },
    { key: 'min_p', t: 'Min P', d: 'Drop words far less likely than the best one.', kind: 'range', min: 0, max: 0.5, step: 0.01, def: 0 },
    { key: 'repeat_penalty', t: 'Repeat penalty', d: 'Discourages repeating itself.', kind: 'range', min: 0.8, max: 2, step: 0.01, def: 1.1 },
    { key: 'num_predict', t: 'Longest reply', d: 'In tokens. -1 has no limit.', kind: 'step', step: 256, def: -1, fmt: (v) => (v === -1 ? 'no limit' : v + ' tokens') },
    { key: 'num_gpu', t: 'Layers on GPU', d: '-1 lets Ollama decide. Fewer frees VRAM but runs slower.', kind: 'step', step: 1, def: -1, fmt: (v) => (v === -1 ? 'automatic' : v + ' layers') },
    { key: 'keep_alive', t: 'Keep loaded for', d: 'Overrides the server setting for this model.', kind: 'combo', def: '' },
    { key: 'think', t: 'Thinking', d: 'Reason step by step before answering. Off is faster.', kind: 'switch', def: true, cap: 'Thinking' },
    { key: 'system', t: 'System prompt', d: 'Instructions sent before every chat with this model.', kind: 'text', def: '' },
  ];
  const MPRESETS = [
    { id: 'mp-default', name: 'Defaults', builtin: true, values: {} },
    { id: 'mp-code', name: 'Coding', builtin: true, values: { temperature: 0.2, top_p: 0.9, top_k: 40, repeat_penalty: 1.05, num_ctx: 32768 } },
    { id: 'mp-creative', name: 'Creative', builtin: true, values: { temperature: 1.05, top_p: 0.95, top_k: 80, repeat_penalty: 1.12 } },
    { id: 'mp-precise', name: 'Precise', builtin: true, values: { temperature: 0.1, top_p: 0.5, top_k: 20, min_p: 0.05 } },
    { id: 'mp-long', name: 'Long documents', builtin: true, values: { num_ctx: 65536, temperature: 0.3, keep_alive: '1h' } },
  ];
  const allMProfiles = () => [...MPRESETS, ...S.mprofiles];
  const mid = (n) => n.replace(/[^a-z0-9]/gi, '_');
  const mdraft = (name) => S.mdraft[name] || (S.mdraft[name] = { ...(S.mcfg[name] || {}) });
  const mDirty = (name) => JSON.stringify(mdraft(name)) !== JSON.stringify(S.mcfg[name] || {});
  const mProfileOf = (name) => { const v = JSON.stringify(S.mcfg[name] || {}); const p = allMProfiles().find((x) => JSON.stringify(x.values) === v); return p ? p.name : 'Custom'; };
  function mval(f, d) { return d[f.key] != null ? d[f.key] : f.def; }
  function mfmt(f, v) { if (f.fmt) return f.fmt(v); return (+v).toFixed(f.step < 0.1 ? 2 : f.step < 1 ? 1 : 0); }
  function modelCfgHtml(m) {
    const d = mdraft(m.name); const id = mid(m.name);
    const fields = MFIELDS.filter((f) => !f.cap || m.caps.includes(f.cap)).filter((f) => !(m.caps.includes('Embeddings') && f.key !== 'num_ctx' && f.key !== 'keep_alive'));
    const row = (f) => {
      const v = mval(f, d); const set = d[f.key] != null;
      let ctl = '';
      if (f.kind === 'range') ctl = `<div class="mrange"><input type="range" id="mr-${id}-${f.key}" data-act="mset" data-m="${esc(m.name)}" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}" aria-label="${f.t}"><output id="mo-${id}-${f.key}" class="mono">${mfmt(f, v)}</output></div>`;
      else if (f.kind === 'step') ctl = `<div class="stepper"><button type="button" data-act="mstep" data-m="${esc(m.name)}" data-key="${f.key}" data-d="${-f.step}" aria-label="Decrease ${f.t}">−</button><output class="tnum mono mstep-v">${mfmt(f, v)}</output><button type="button" data-act="mstep" data-m="${esc(m.name)}" data-key="${f.key}" data-d="${f.step}" aria-label="Increase ${f.t}">+</button></div>`;
      else if (f.kind === 'switch') ctl = `<button class="switch" role="switch" aria-checked="${!!v}" aria-label="${f.t}" data-act="mtoggle" data-m="${esc(m.name)}" data-key="${f.key}" type="button"></button>`;
      else if (f.kind === 'combo') ctl = combo('mk-' + id, [['', 'Server setting', 'from the Settings below']].concat(KEEP), { value: v, onPickKey: 'm:' + m.name + ':keep_alive', width: 190 });
      else if (f.kind === 'text') ctl = `<textarea class="textarea" id="mt-${id}" rows="2" data-act="mtext" data-m="${esc(m.name)}" data-key="${f.key}" placeholder="You are a careful coding assistant…" aria-label="${f.t}">${esc(v || '')}</textarea>`;
      return `<div class="setting${f.kind === 'text' ? ' stack' : ''}" data-k="mset:${esc(m.name)}:${f.key}"><div><div class="t">${f.t}${set ? '<span class="adv-badge" style="color:var(--good)">Set</span>' : ''}</div><div class="d">${f.d}</div></div><div class="ctl">${ctl}</div></div>`;
    };
    const dirty = mDirty(m.name);
    return `<div class="model-cfg" data-k="mcfg:${esc(m.name)}">
      <h4>Settings for this model</h4>
      <div class="mprofiles"><span class="muted">Profile</span>${allMProfiles().map((p) => `<button type="button" class="chip" data-act="mprof" data-m="${esc(m.name)}" data-v="${p.id}" aria-pressed="${JSON.stringify(p.values) === JSON.stringify(d)}">${esc(p.name)}</button>`).join('')}</div>
      <div class="mfields">${fields.map(row).join('')}</div>
      <div class="footer-bar">
        ${S.mnaming && S.mnaming.model === m.name
          ? `<input class="input" id="mp-name-${id}" data-act="mp-name" placeholder="Profile name" value="${esc(S.mnaming.name)}" style="width:180px" aria-label="Profile name"><button class="btn sm primary" type="button" data-act="mp-save" data-m="${esc(m.name)}">Save profile</button><button class="btn sm ghost" type="button" data-act="mp-cancel">Cancel</button>`
          : `<button class="btn sm ghost" type="button" data-act="mp-new" data-m="${esc(m.name)}">Save as profile…</button><button class="btn sm ghost" type="button" data-act="modelfile" data-m="${esc(m.name)}">${icon('copy')}Copy as Modelfile</button>`}
        <span class="grow"></span>
        ${dirty ? `<span class="dirty">Unsaved</span><button class="btn sm" type="button" data-act="mdiscard" data-m="${esc(m.name)}">Discard</button>` : ''}
        <button class="btn sm primary" type="button" data-act="msave" data-m="${esc(m.name)}" ${dirty ? '' : 'disabled'}>Save for ${esc(m.name.split(':')[0])}</button>
      </div>
    </div>`;
  }
  function modelfile(m) {
    const d = S.mcfg[m.name] || mdraft(m.name);
    const lines = [`FROM ${m.name}`];
    for (const f of MFIELDS) {
      const v = d[f.key]; if (v == null || v === '') continue;
      if (f.key === 'system') lines.push(`SYSTEM """${v}"""`);
      else if (f.key === 'keep_alive' || f.key === 'think') lines.push(`# ${f.key} ${v}  (sent per request; not a Modelfile setting)`);
      else lines.push(`PARAMETER ${f.key} ${v}`);
    }
    return lines.join('\n');
  }

  // ---------- layouts ----------
  const LAYOUTS = {
    rows: {
      label: 'Rows', render: () => `<div class="card" data-k="card:main">
        ${header(false)}
        <div style="height:12px"></div>
        ${section('models', 'Models', modelsSum(), downloader() + modelsList(false))}
        ${section('settings', 'Settings', dirtyKeys().length ? dirtyKeys().length + ' unsaved' : '', `${profileBar()}<div class="groups" data-k="groups">${GROUPS.map((g) => groupBlock(g, false)).join('')}</div>${settingsFooter()}`)}
        ${section('logs', 'Logs', 'Live', logsBlock())}
      </div>`,
    },
    tiles: {
      label: 'Tiles', render: () => `
        <div class="card" data-k="card:header">${header(true)}</div>
        <div class="card" data-k="card:models"><div class="group-title" style="font-size:14px">Models<span class="muted" style="font-weight:400;font-size:12px;margin-left:auto">${modelsSum()}</span></div>${downloader()}${modelsList(true)}</div>
        <div class="card" data-k="card:settings"><div class="group-title" style="font-size:14px">Settings</div>${profileBar()}<div class="tile-grid" data-k="groups">${GROUPS.map((g) => groupBlock(g, true)).join('')}</div>${settingsFooter()}</div>
        <div class="card" data-k="card:logs">${section('logs', 'Logs', 'Live', logsBlock())}</div>`,
    },
    split: {
      label: 'Split', render: () => `
        <div class="card" data-k="card:header">${header(true)}</div>
        <div class="split" data-k="split">
          <div class="col" data-k="col:left"><div class="card" data-k="card:models"><div class="group-title" style="font-size:14px">Models<span class="muted" style="font-weight:400;font-size:12px;margin-left:auto">${modelsSum()}</span></div>${downloader()}${modelsList(false)}</div>

  const RUN = {
    chase(el, p) {

        o.style.setProperty('--c', p.color); o.style.setProperty('--w', p.width + 'px'); o.style.setProperty('--arc', p.arc); o.style.setProperty('--g', p.glow + 'px');
