    Terminal: { theme: 'dark', 'r-card': 0, 'r-ctl': 0, 'r-btn': 0, 'b-alpha': 40, 'edge-col': '#33ff66', 'edge-tint': 70, good: '#33ff66', 'good-2': '#b3ff66', fs: 13, gmode: 'off', 'acc-h': 140, 'acc-c': 0.15, glow: 0.25, 'glow-col': '#33ff66', 'burst-col': '#33ff66' },
    Brutal: { 'r-card': 0, 'r-ctl': 0, 'r-btn': 0, bw: 2, 'b-alpha': 100, pad: 18, gmode: 'off', bmode: 'off' },
    Pastel: { 'bg-h': 320, 'bg-c': 0.015, 'card-c': 0.012, 'acc-h': 300, 'acc-c': 0.08, 'r-card': 20, 'r-ctl': 12, g1: '#ffc6e0', g2: '#c6dcff', g3: '#d6ffe9', 'grad-i': 0.45, good: '#6cc79a', 'good-2': '#8fd3e8', curve: 2 },
    Aurora: { theme: 'dark', gmode: 'aurora', 'grad-i': 0.55, 'g-blur': 90, 'g-size': 90, g1: '#2fd3a0', g2: '#6a5cff', g3: '#1fa8ff', 'g-move': 1.6, 'grad-t': 60, glass: 0.3, blur: 20 },
    Mono: { 'acc-c': 0, 'bg-c': 0, 'card-c': 0, gmode: 'off', bmode: 'sweep', 'burst-col': '#888888', good: '#8a8a8a', 'good-2': '#b0b0b0', 'b-alpha': 20 },
  };
  const style = Object.assign(ORIGINAL(), store.get('style', {}));
  if (!style.motion || typeof style.motion !== 'object') style.motion = MOTION_DEFAULT();

  function cssValue(k, v) {
    if (k.type === 'color') return v || '';
    if (k.type === 'chips') return v;
    if (k.pill && v >= 20) return '999px';
    return v + k.unit;
  }
  function applyStyle() {
    const root = document.documentElement;
    for (const k of ALLK) {
      const v = style[k.id];
      if (k.type === 'chips') { root.dataset[k.id] = v; root.style.setProperty('--' + k.id, v); continue; }
      const val = cssValue(k, v);
      if (val === '') root.style.removeProperty('--' + k.id); else root.style.setProperty('--' + k.id, val);
    }
    root.style.setProperty('--cs', cornerSupported ? curveCss(style.curve) : 'round');
    root.classList.toggle('size-sm', style.size === 'sm');
    if (style.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', style.theme);
    const out = document.getElementById('cssOut'); if (out) out.value = exportCss();
    store.set('style', style);
    if (typeof fxRestart === 'function') fxRestart();
    syncLab();
  }
  function exportCss() {
    const lines = ALLK.filter((k) => k.type !== 'chips' && style[k.id] != null).map((k) => `  --${k.id}: ${cssValue(k, style[k.id])};`);
    const chips = ALLK.filter((k) => k.type === 'chips').map((k) => `${k.id}: ${style[k.id]}`).join('; ');
    return `/* Radium Panel Lab: ${new Date().toISOString().slice(0, 10)} */\n:root {\n${lines.join('\n')}\n  --cs: ${curveCss(style.curve)};\n  /* ${chips}; card size: ${style.size} */\n}`;
  }

  // ---------- saved looks ----------
  const LOOKS = { list: store.get('looks', []), naming: '' };
  const lookBody = (name) => clone({ name, style, layout: S.layout, menu: S.menu, edits: ED.edits, updatedAt: Date.now() });
  function saveLook(name, id) {
    const lid = id || 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const body = lookBody(name);
    const at = LOOKS.list.findIndex((l) => l.id === lid);
    if (at >= 0) LOOKS.list[at] = { id: lid, createdAt: LOOKS.list[at].createdAt, ...body }; else LOOKS.list.push({ id: lid, createdAt: Date.now(), ...body });
    store.set('looks', LOOKS.list);
    if (ED.db) { const { id: _drop, ...doc } = LOOKS.list.find((l) => l.id === lid); queued('looks/' + lid, () => ED.db.doc('looks/' + lid).set(clone(doc))); }
    return lid;
  }
  function applyLook(l) {
    const keepMotion = style.motion;
    Object.keys(style).forEach((k) => delete style[k]);
    Object.assign(style, ORIGINAL(), clone(l.style || {}));
    if (!style.motion) style.motion = keepMotion;
    if (l.layout && LAYOUTS[l.layout]) { S.layout = l.layout; store.set('layout', S.layout); }
    if (l.menu) { S.menu = l.menu; store.set('menu', S.menu); }
    replaceEdits(clone(l.edits || {}));
    applyStyle(); renderPanel(); render(); renderEd(); surge();
  }
  function replaceEdits(next) {
    const layouts = new Set([...Object.keys(ED.edits), ...Object.keys(next)]);
    ED.edits = next;
    layouts.forEach((l) => { E(l); ED.dirty.add(l); });
    store.set('edits', ED.edits); applyEdits(); flushEdits();
  }
  function resetToOriginal() {
    const stamp = new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    ask({ title: 'Reset everything to the original?', text: `Colours, corners, effects, motion, layout and everything you grabbed and moved go back to how Claude gave them. Your current look is saved first as “Before reset, ${esc(stamp)}”, so you can get it back from Saved looks. Comments and saved runtime profiles stay.`, ok: 'Reset', danger: true, onOk: () => {
      saveLook(`Before reset, ${stamp}`);
      Object.keys(style).forEach((k) => delete style[k]);
      Object.assign(style, ORIGINAL());
      S.layout = 'rows'; S.menu = 'full'; store.set('layout', S.layout); store.set('menu', S.menu);
      S.draft = { ...saved }; S.saved = { ...saved };
      replaceEdits({}); ED.undo = []; ED.redo = []; ED.sel = null;
      applyStyle(); renderPanel(); render(); renderEd();
      toast('Back to the original. Your previous look is in Saved looks.');
    } });
  }

  // ---------- panel ----------
  const PANEL_OPEN = new Set(store.get('panel-open', ['looks', 'edges']));
  function fmtK(k) {
    const v = style[k.id];
    if (k.type === 'color') return v || 'theme';
    if (k.type === 'chips') return '';
    if (k.pill && v >= 20) return 'pill';
    const dec = k.step < 0.01 ? 3 : k.step < 1 ? (k.step < 0.1 ? 2 : 1) : 0;
    return (+v).toFixed(dec).replace(/\.0+$/, '') + k.unit;
  }
  function knobHtml(k) {
    const v = style[k.id];
    if (k.type === 'chips') return `<div class="knob"><label>${k.label}</label><div class="chipset" style="grid-column:1/-1">${k.opts.map(([o, l]) => `<button type="button" data-chip="${k.id}" data-v="${o}" aria-pressed="${v === o}">${l}</button>`).join('')}</div></div>`;
    if (k.type === 'color') {
      const hex = v || cssHex(k.auto);
      return `<div class="knob color"><label for="k-${k.id}">${k.label}</label><span class="cpick"><input type="color" id="k-${k.id}" value="${hex}" data-knob="${k.id}"><output id="o-${k.id}">${v ? v : 'theme'}</output>${k.auto ? `<button type="button" class="mini" data-auto="${k.id}" ${v ? '' : 'disabled'}>Auto</button>` : ''}</span>${k.hint ? `<div class="note" style="grid-column:1/-1">${k.hint}</div>` : ''}</div>`;
    }
    return `<div class="knob${k.hue ? ' hue' : ''}"><label for="k-${k.id}">${k.label}</label><output id="o-${k.id}" for="k-${k.id}">${fmtK(k)}</output>
      <input type="range" id="k-${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${v}" data-knob="${k.id}">
      ${k.chips ? `<div class="chipset" style="grid-column:1/-1">${k.chips.map(([cv, l]) => `<button type="button" data-chip="${k.id}" data-v="${cv}" aria-pressed="${+v === cv}">${l}</button>`).join('')}</div>` : ''}
      ${k.hint ? `<div class="note" style="grid-column:1/-1">${k.hint}</div>` : ''}</div>`;
  }
  function labSection(id, title, body, extra = '') {
    return `<details class="lab-sec" data-psec="${id}" ${PANEL_OPEN.has(id) ? 'open' : ''}><summary>${icon('chev', 'i chev')}<span>${title}</span>${extra}</summary><div class="lab-body">${body}</div></details>`;
  }
  function renderPanel() {
    const panel = document.getElementById('panel');
    const scroll = panel.scrollTop;
    const looks = LOOKS.list.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    const when = (t) => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    panel.innerHTML = `<div class="lab-head"><h2>Style lab</h2><button type="button" class="btn sm" id="resetAll" title="Put everything back to how Claude gave it">${icon('reset')}Reset to original</button></div>
      ${labSection('looks', 'Saved looks', `
        <div class="save-row"><input class="input" id="lookName" placeholder="Name this look" value="${esc(LOOKS.naming)}" aria-label="Look name"><button type="button" class="btn sm primary" id="saveLook">Save look</button></div>
        <div class="note">Saves colours, corners, effects, motion, the layout and everything you grabbed and changed.</div>
        ${looks.length ? `<ul class="look-list">${looks.map((l) => `<li><button type="button" class="look-apply" data-look="${l.id}"><b>${esc(l.name)}</b><small>${when(l.updatedAt || l.createdAt)}</small></button><button type="button" class="mini" data-look-up="${l.id}" title="Replace this saved look with what's on screen">Update</button><button type="button" class="mini danger" data-look-del="${l.id}" aria-label="Delete ${esc(l.name)}">${icon('x')}</button></li>`).join('')}</ul>` : '<div class="note">No saved looks yet.</div>'}
        <div class="lab-sub">Presets</div>
        <div class="presets">${Object.keys(PRESETS).map((p) => `<button type="button" data-preset="${p}">${p}</button>`).join('')}</div>`)}
      ${KNOBS.map((g) => labSection(g.id, g.group, g.items.map(knobHtml).join('') + (g.id === 'edges' && !cornerSupported ? '<div class="note">Corner curve needs Chrome or Edge 139+ (Radium’s WebView2 gets it with Edge updates). This browser shows round corners.</div>' : ''), `<button type="button" class="mini sec-reset" data-greset="${g.id}" title="Reset ${g.group.toLowerCase()}">Reset</button>`)).join('')}
      ${labSection('view', 'Card size and theme', `<div class="knob"><label>Card size</label><div class="chipset" style="grid-column:1/-1">${[['default', 'Default'], ['sm', 'Small']].map(([v, l]) => `<button type="button" data-size="${v}" aria-pressed="${style.size === v}">${l}</button>`).join('')}</div></div>
        <div class="knob"><label>Preview theme</label><div class="chipset" style="grid-column:1/-1">${[['system', 'System'], ['dark', 'Dark'], ['light', 'Light']].map(([v, l]) => `<button type="button" data-theme-pick="${v}" aria-pressed="${style.theme === v}">${l}</button>`).join('')}</div></div>`)}
      ${labSection('try', 'Try it', `<div class="chipset"><button type="button" id="burst">Page-change burst</button><button type="button" id="dlgDemo">Confirm pop-up</button><button type="button" id="openMotion">Motion and effects…</button></div>`)}
      ${labSection('export', 'Your settings as CSS', `<textarea id="cssOut" readonly aria-label="Style settings as CSS">${exportCss()}</textarea>
        <div class="chipset"><button type="button" id="copyCss">Copy settings</button></div>
        <div class="note">These save with the page, so Claude can read them. Copy works too.</div>`)}`;
    panel.scrollTop = scroll;
    panel.oninput = (e) => {
      if (e.target.id === 'lookName') { LOOKS.naming = e.target.value; return; }
      const id = e.target.dataset.knob; if (!id) return;
      const k = knob(id);
      style[id] = k.type === 'color' ? e.target.value : parseFloat(e.target.value);
      const o = document.getElementById('o-' + id); if (o) o.textContent = fmtK(k);
      if (k.type === 'color') { const a = panel.querySelector(`[data-auto="${id}"]`); if (a) a.disabled = false; }
      if (k.chips) panel.querySelectorAll(`[data-chip="${id}"]`).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === style[id])));
      applyStyle();
    };
    panel.onkeydown = (e) => { if (e.target.id === 'lookName' && e.key === 'Enter') { e.preventDefault(); document.getElementById('saveLook').click(); } };
    panel.ontoggle = null;
    panel.addEventListener('toggle', onPanelToggle, true);
    panel.onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.closest('summary') && (b.dataset.greset)) e.preventDefault();
      if (b.dataset.preset) {
        const p = PRESETS[b.dataset.preset];
        const keep = { motion: style.motion, size: style.size, theme: style.theme };
        Object.keys(style).forEach((k) => delete style[k]);
        Object.assign(style, ORIGINAL(), keep, clone(p));
        applyStyle(); renderPanel(); surge();
      } else if (b.dataset.chip) {
        const k = knob(b.dataset.chip); style[k.id] = k.type === 'chips' ? b.dataset.v : parseFloat(b.dataset.v);
        applyStyle(); renderPanel();
      } else if (b.dataset.auto) { style[b.dataset.auto] = null; applyStyle(); renderPanel(); }
      else if (b.dataset.greset) { KNOBS.find((g) => g.id === b.dataset.greset).items.forEach((k) => { style[k.id] = clone(k.v); }); applyStyle(); renderPanel(); }
      else if (b.dataset.size) { style.size = b.dataset.size; applyStyle(); renderPanel(); }
      else if (b.dataset.themePick) { style.theme = b.dataset.themePick; applyStyle(); renderPanel(); }
      else if (b.dataset.look) { const l = LOOKS.list.find((x) => x.id === b.dataset.look); if (l) { applyLook(l); toast(`“${l.name}” applied`); } }
      else if (b.dataset.lookUp) { const l = LOOKS.list.find((x) => x.id === b.dataset.lookUp); if (l) { saveLook(l.name, l.id); renderPanel(); toast(`“${l.name}” updated`); } }
      else if (b.dataset.lookDel) { const l = LOOKS.list.find((x) => x.id === b.dataset.lookDel); if (l) ask({ title: `Delete “${l.name}”?`, text: 'Only the saved look is removed. What’s on screen stays as it is.', ok: 'Delete', danger: true, onOk: () => { LOOKS.list = LOOKS.list.filter((x) => x !== l); store.set('looks', LOOKS.list); if (ED.db) queued('looks/' + l.id, () => ED.db.doc('looks/' + l.id).delete()); renderPanel(); } }); }
      else if (b.id === 'saveLook') { const name = (LOOKS.naming || '').trim() || `Look ${LOOKS.list.length + 1}`; saveLook(name); LOOKS.naming = ''; renderPanel(); toast(`Saved “${name}”`); }
      else if (b.id === 'resetAll') resetToOriginal();
      else if (b.id === 'burst') surge();
      else if (b.id === 'openMotion') { ED.motion = true; ED.insp = false; renderEd(); }
      else if (b.id === 'dlgDemo') ask({ title: 'Delete gemma3:27b?', text: 'This removes the model from disk and frees about 17 GB. You can download it again later.', ok: 'Delete', danger: true });
      else if (b.id === 'copyCss') { const ta = document.getElementById('cssOut'); ta.select(); copy(exportCss(), 'Settings copied'); }
    };
  }
  function onPanelToggle(e) {
    const id = e.target.dataset && e.target.dataset.psec; if (!id) return;
    if (e.target.open) PANEL_OPEN.add(id); else PANEL_OPEN.delete(id);
    store.set('panel-open', [...PANEL_OPEN]);
  }

  applyStyle();
  renderPanel();
  render();
})();
</script>
</body>
</html>
