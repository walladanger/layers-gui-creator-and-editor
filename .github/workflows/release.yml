name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run installer:check
      - run: npm test
      - name: Test native commands
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npm run tauri:build -- --ci -- --locked
      - name: Verify installation, launch, shortcuts and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer missing.' }
          ./.github/scripts/Test-WindowsInstaller.ps1 -Installer $installer.FullName
      - name: Create installer checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) + @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($files.Count -ne 2) { throw 'Expected one EXE installer and one MSI installer.' }
          $files | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content -Encoding utf8 src-tauri/target/release/bundle/SHA256SUMS.txt
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: layers-windows-installer
          if-no-files-found: error
          # Only needed to hand the installers to the release job / for PR review;
          # keep storage use low (private-repo artifact quota is account-wide).
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: layers-windows-installer
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.exe
            installers/**/*.msi
            installers/**/SHA256SUMS.txt
          fail_on_unmatched_files: true
