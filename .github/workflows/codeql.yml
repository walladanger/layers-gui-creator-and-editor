name: CodeQL

# This repository is private and does not have GitHub Code Security enabled,
# so SARIF results cannot be uploaded to the Security tab (the upload step was
# failing with "Code scanning is not enabled"). The full security-extended
# analysis still runs on every push/PR/week; results are kept as an artifact
# and the job FAILS if CodeQL reports any finding, so it remains a real gate.
# If Code Security is enabled later, set `upload: always` and drop the gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results

      - name: Keep SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn

      - name: Fail on CodeQL findings
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::CodeQL produced no SARIF"; exit 1; fi
          count=0
          for f in "${files[@]}"; do
            while IFS=$'\t' read -r level rule uri line msg; do
              echo "::error file=${uri},line=${line},title=CodeQL ${rule}::${msg}"
              count=$((count+1))
            done < <(jq -r '.runs[].results[]? | [(.level // "warning"), .ruleId, (.locations[0].physicalLocation.artifactLocation.uri // ""), (.locations[0].physicalLocation.region.startLine // 1 | tostring), (.message.text | gsub("\n"; " "))] | @tsv' "$f")
          done
          echo "CodeQL findings: $count"
          [ "$count" -eq 0 ]
