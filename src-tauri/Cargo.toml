[package]
name = "ember-studio"
version = "0.1.0"
description = "Reusable Tauri foundation for premium Windows desktop applications"
authors = ["Ember Studio"]
edition = "2021"

[lib]
name = "ember_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
percent-encoding = "2.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
